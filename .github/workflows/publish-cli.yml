# Cuts a CLI release: cross-platform binaries + checksums on a GitHub Release,
# the Homebrew cask, the Scoop manifest, and the GHCR image.
#
# workflow_dispatch only, deliberately. Nothing about pushing code should
# publish anything .
#
# Requires, before the first run (the repository README):
#   HOMEBREW_TAP_TOKEN   PAT with contents:write on glimpsed-io/homebrew-tap
#   SCOOP_BUCKET_TOKEN   PAT with contents:write on glimpsed-io/scoop-bucket
# GITHUB_TOKEN covers the Release and GHCR push.
name: publish-cli

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release, e.g. cli/v0.1.0"
        required: true
      dry_run:
        description: "Build and package, but publish nothing"
        type: boolean
        default: true

permissions:
  contents: write # create the Release
  packages: write # push to GHCR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser needs history for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Tag the release
        if: ${{ !inputs.dry_run }}
        run: |
          git tag "${{ inputs.tag }}"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dry run: build and package everything, publish nothing. Safe to run
      # before any secret exists.
      - name: Build only (dry run)
        if: ${{ inputs.dry_run }}
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,announce

      - name: Release
        if: ${{ !inputs.dry_run }}
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

      - name: Keep the built artifacts for inspection
        uses: actions/upload-artifact@v4
        with:
          name: missu-cli-dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: warn
